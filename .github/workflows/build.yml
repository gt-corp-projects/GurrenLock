name: Build VPK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verified_commit:
        description: 'Commit SHA tested in game (leave blank to build only)'
        required: false
        type: string
      verified_vpk_sha256:
        description: 'SHA-256 of the main VPK tested in game'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and test
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          node Tests/LoadingScreen.cjs
          node Preview/Tests/Preview.cjs
      - name: Install modlock
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o modlock https://github.com/paralin/modlock/releases/download/v0.1.73/modlock-linux-amd64
          echo 'e7c55bdffc9500e15396ada10a6be22e107c5d5ca50fb579b831cfcaf9fba20b  modlock' | sha256sum -c -
          chmod +x modlock
      - name: Build and inspect VPKs
        shell: bash
        env:
          MODLOCK_NO_UPDATE_CHECK: "1"
        run: |
          set -euo pipefail
          mkdir -p dist preview-build/panorama/{scripts,styles}
          cp -R Preview/Source/. preview-build/
          cp Source/panorama/scripts/gurrenlock.js preview-build/panorama/scripts/
          cp Source/panorama/styles/gurrenlock.css preview-build/panorama/styles/
          ./modlock panorama compile Source --addon gurrenlock -o dist/GurrenLock_dir.vpk
          ./modlock panorama compile preview-build --addon gurrenlock -o dist/GurrenLock-Preview_dir.vpk
          ./modlock vpk list dist/GurrenLock_dir.vpk
          ./modlock vpk list dist/GurrenLock-Preview_dir.vpk
          (cd dist && sha256sum *.vpk > SHA256SUMS.txt)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GurrenLock-vpk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - name: Publish game-tested build
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.verified_commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_COMMIT: ${{ inputs.verified_commit }}
          VERIFIED_HASH: ${{ inputs.verified_vpk_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFIED_COMMIT" == "$GITHUB_SHA" ]] || { echo "Tested commit does not match this build"; exit 1; }
          [[ "$VERIFIED_HASH" =~ ^[a-f0-9]{64}$ ]] || { echo "Enter the tested VPK SHA-256"; exit 1; }
          echo "$VERIFIED_HASH  dist/GurrenLock_dir.vpk" | sha256sum -c -
          version=$(cat VERSION)
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "GurrenLock $version" --notes "Built from commit $GITHUB_SHA. Install videos and final-frame PNGs separately; see the README."

      - name: Replace v0.1 with the tested v0.2 files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Repair v0.1 release and remove v0.2'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tested verification
          gh release download v0.2 --dir tested
          echo '7daaf7d7c1b3acffee3a1a787bfaf1b6bb7db8df05f845f6c4e62292c3461f76  tested/GurrenLock_dir.vpk' | sha256sum -c -
          (cd tested && sha256sum -c SHA256SUMS.txt)
          gh release upload v0.1 tested/* --clobber
          gh release download v0.1 --dir verification
          (cd verification && sha256sum -c SHA256SUMS.txt)
          echo '7daaf7d7c1b3acffee3a1a787bfaf1b6bb7db8df05f845f6c4e62292c3461f76  verification/GurrenLock_dir.vpk' | sha256sum -c -
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.1" -f sha="$GITHUB_SHA" -F force=true
          gh release edit v0.1 --title 'GurrenLock 0.1' --notes 'The main VPK is the game-tested build previously published as 0.2. Videos and final-frame PNGs are installed separately; see the README.'
          gh release delete v0.2 --yes --cleanup-tag
